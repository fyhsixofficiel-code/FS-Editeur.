# ÉTAPE UNIQUE — crée la clé de signature Android de FS Editeur.
# Toutes les futures versions de l'APK doivent être signées avec CETTE clé pour s'installer par-dessus
# l'ancienne version sans perdre les projets. Prérequis : le secret ANDROID_KEYSTORE_PASSWORD (votre mot de passe).
name: "1 · Créer la clé Android (une seule fois)"
on: workflow_dispatch
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le mot de passe
        env: { PW: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" }
        run: |
          if [ ${#PW} -lt 8 ]; then echo "::error::Créez d'abord le secret ANDROID_KEYSTORE_PASSWORD (8 caractères minimum). Voir GUIDE-INSTALLATION.md, étape 3."; exit 1; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Générer la clé (valable 30 ans, protégée par votre mot de passe)
        env: { PW: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" }
        run: |
          keytool -genkeypair -v -keystore fseditor.keystore -storetype PKCS12 -alias fseditor -keyalg RSA -keysize 4096 -validity 11000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=FS Editeur, O=FS Editeur, C=MG"
          base64 -w 0 fseditor.keystore > ANDROID_KEYSTORE_BASE64.txt
          echo "Clé créée. Téléchargez l'artefact, copiez le contenu du fichier dans le secret ANDROID_KEYSTORE_BASE64, puis supprimez l'artefact." >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with: { name: cle-android, path: ANDROID_KEYSTORE_BASE64.txt, retention-days: 1 }
